<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">Wireframe de inicio de sesión</title>
  <desc id="desc">Formulario de email y contraseña con estados vacío, error de credenciales y acceso correcto.</desc>
  <rect width="900" height="560" fill="#fff" stroke="#111"/>
  <text x="40" y="52" font-size="26">CONCILIADOR</text><text x="700" y="52">Acceso</text>
  <rect x="250" y="100" width="400" height="380" fill="#f5f5f5" stroke="#111"/>
  <text x="290" y="145" font-size="22">Iniciar sesión</text>
  <text x="290" y="190">Email</text><rect x="290" y="205" width="320" height="42" fill="#fff" stroke="#111" stroke-width="3"/><text x="300" y="232">usuario@ejemplo.test</text>
  <text x="290" y="280">Contraseña</text><rect x="290" y="295" width="320" height="42" fill="#fff" stroke="#555"/><text x="300" y="322">••••••••••</text>
  <rect x="290" y="365" width="320" height="48" fill="#ddd" stroke="#111"/><text x="395" y="395">Ingresar</text>
  <text x="290" y="445">Estado de error: Credenciales inválidas.</text>
  <text x="290" y="468">Estado correcto: navega a Cargas.</text>
</svg>
