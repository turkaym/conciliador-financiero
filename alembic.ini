[alembic]
prepend_sys_path = .
path_separator = os

[master]
script_location = alembic_master
sqlalchemy.url =

[tenants]
script_location = alembic_tenants
sqlalchemy.url =

# Configuración de Logs (Standard)
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
