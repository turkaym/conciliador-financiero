databases:
  - name: conciliador-db
    databaseName: conciliador
    user: conciliador
    plan: free

services:
  - type: web
    name: conciliador-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install .
    startCommand: python -m app.initialize_database && uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-10000}
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: conciliador-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_SCHEMA_PATH
        value: ../database/schema.sql
      - key: DATABASE_SEED_PATH
        value: ../database/seed.sql

  - type: web
    name: conciliador-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
