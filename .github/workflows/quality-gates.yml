name: Quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend-quality:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend/app
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/app/package-lock.json
      - name: Clean install
        run: npm ci
      - name: Prove feature contracts
        run: |
          node --experimental-strip-types src/featureFlags.test.ts
          node --experimental-strip-types src/features/ai-rules/aiRules.test.ts
      - name: Build production frontend
        run: npm run build
      - name: Enforce high and critical audit threshold
        run: npm audit --audit-level=high

  backend-governance:
    name: Backend and governance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set comparison range
        id: range
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "base=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          fi
          echo "head=${{ github.sha }}" >> "$GITHUB_OUTPUT"
      - name: Reject secret-sensitive tracked paths
        run: python scripts/ci/check_sensitive_paths.py "${{ steps.range.outputs.base }}" "${{ steps.range.outputs.head }}"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/api-gateway/requirements-ci.txt
      - name: Install focused test dependencies
        run: python -m pip install -r services/api-gateway/requirements-ci.txt
      - name: Run focused backend tests
        env:
          SECRET_KEY: ci-only-not-a-secret
          ENCRYPTION_KEY_MASTER: ci-only-not-a-secret
          DB_USER: ci_user
          DB_PASSWORD: ci_password
          DB_HOST: localhost
          RABBITMQ_URL: amqp://ci:ci@localhost:5672/
        run: python -m unittest tests.test_feature_flags tests.test_feature_composition tests.test_ai_rules
      - name: Compile and import changed Python boundaries
        env:
          SECRET_KEY: ci-only-not-a-secret
          ENCRYPTION_KEY_MASTER: ci-only-not-a-secret
          DB_USER: ci_user
          DB_PASSWORD: ci_password
          DB_HOST: localhost
          RABBITMQ_URL: amqp://ci:ci@localhost:5672/
        run: |
          python -m compileall -q config core services/api-gateway tests scripts/ci
          python -c "from config.feature_flags import feature_flags; from core.api.v1.endpoints.ai_rules import router; assert feature_flags.usable('ai_rules') and router"
      - name: Validate Docker Compose configuration
        run: bash scripts/ci/check_compose_config.sh
